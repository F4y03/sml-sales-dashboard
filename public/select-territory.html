<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dashboard PROPLUS</title>
    <link rel="icon" type="image/png" href="/assets/pr-plus-logo-red.png" />
    <link rel="stylesheet" href="workspace-nav.css" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="theme-modes.css" />
    <link rel="stylesheet" href="access-ui.css?v=20260923-tabs-light-theme" />
    <script src="theme-mode.js"></script>
    <script src="workspace-nav.js" defer></script>
    <script src="select-territory.js" type="module"></script>
  </head>
  <body>
    <main class="admin-shell territory-page">
      <header class="admin-hero">
        <div>
          <p class="admin-eyebrow">SALES WORKSPACE</p>
          <h1>เลือกเขตที่ต้องการดู</h1>
          <p class="admin-intro">
            ข้อมูลยอดขาย ลูกค้า และสินค้าฝากจะแสดงเฉพาะเขตที่เลือก
            เปลี่ยนเขตได้ภายหลังจากแถบด้านบนของแต่ละหน้า
          </p>
        </div>
        <div class="admin-hero-mark" aria-hidden="true">
          <span>PROPLUS</span><small>REGION</small>
        </div>
      </header>
      <div class="territory-toolbar">
        <p id="territory-status" class="territory-status" role="status">
          กำลังโหลดเขตการขาย…
        </p>
      </div>
      <section
        id="territory-choices"
        class="territory-choices"
        aria-label="เขตที่ได้รับมอบหมาย"
        aria-busy="true"
      >
        <div class="territory-skeleton" aria-hidden="true"></div>
        <div class="territory-skeleton" aria-hidden="true"></div>
        <div class="territory-skeleton" aria-hidden="true"></div>
      </section>
    </main>
  </body>
</html>
