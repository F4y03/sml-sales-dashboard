<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>รายงาน SML</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="workspace-nav.css"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="reports.css"><script src="workspace-nav.js" defer></script><script src="reports-ui.js" defer></script></head>
<body><main class="report-main">
<header class="heading"><div><h1>รายงาน SML</h1><p class="subtitle">เลือกหมวดและรายงาน เพื่อดูข้อมูลจาก SML</p></div><button id="reload-reports" type="button" class="button secondary">โหลดรายการใหม่</button></header>
<section class="card report-picker"><label for="report-search">ค้นหารายงาน<input id="report-search" type="search" placeholder="ชื่อหรือรหัสรายงาน"></label><label for="report-select">รายงาน<select id="report-select" disabled><option value="">กำลังโหลด…</option></select></label><small id="catalog-count" role="status"></small></section>
<details id="report-settings" class="card report-settings" hidden><summary>ปรับวันที่ / เงื่อนไขรายงาน</summary><form id="report-form" hidden><div id="condition-fields" class="condition-grid"></div><div class="report-actions"><label>ชุดข้อมูล<select id="dataset"></select></label><button id="run-report" class="button primary" type="submit">แสดงรายงาน</button></div><p class="form-help">ช่องรหัสเว้นว่าง = ทั้งหมด · วันที่ใช้ตามเงื่อนไขที่แสดง</p></form></details>
<p id="report-status" class="status" role="status" aria-live="polite">เลือกหมวดหรือรายงานเพื่อเริ่มต้น</p>
<article id="result-card" class="card report-result" hidden><header class="result-heading"><div><h2 id="result-title" tabindex="-1"></h2><p id="result-context" class="subtitle"></p><p id="result-info" class="subtitle"></p></div><div class="report-actions"><button id="csv-report" class="button secondary">ดาวน์โหลด CSV</button><button id="print-report" class="button secondary">พิมพ์ / PDF</button></div></header><div class="result-scroll" tabindex="0" role="region" aria-label="ตารางรายงาน"><table><thead id="result-head"></thead><tbody id="result-body"></tbody></table></div><nav class="pagination"><button id="previous-page" class="button secondary">← ก่อนหน้า</button><span id="page-label"></span><button id="next-page" class="button secondary">ถัดไป →</button></nav></article>
</main></body></html>
