<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dashboard PROPLUS</title>
    <link rel="icon" type="image/png" href="/assets/pr-plus-logo-red.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="workspace-nav.css" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="reports.css?v=20261022-ux7" />
    <script src="workspace-nav.js?v=20261021-customer-stock" defer></script>
    <script src="date-dmy.js?v=20261022-reports2" defer></script>
    <script src="reports-ui.js?v=20261022-ux7" defer></script>
    <link rel="stylesheet" href="/theme-modes.css" />
    <script src="/theme-mode.js"></script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#e11d2a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PROPLUS" />
    <link rel="apple-touch-icon" href="/assets/app-icon-180.png?v=2" />
    <script src="/pwa-install.js" defer></script>
  </head>
  <body>
    <main class="report-main">
      <header class="heading">
        <div>
          <h1>รายงาน SML</h1>
          <p class="subtitle">เลือกหมวดและรายงาน เพื่อดูข้อมูลจาก SML</p>
        </div>
        <button id="reload-reports" type="button" class="button secondary">
          โหลดรายการใหม่
        </button>
      </header>
      <section class="card report-quick" aria-labelledby="quick-title">
        <h2 id="quick-title">รายงานใช้บ่อย</h2>
        <div id="quick-reports" class="quick-reports"></div>
        <small class="quick-help">กด ☆ ข้างชื่อรายงานเพื่อปักหมุดไว้ที่นี่ · รายงานที่เปิดล่าสุดต่อท้ายให้อัตโนมัติ</small>
      </section>
      <section class="card report-picker">
        <label for="report-search"
          >ค้นหารายงาน<input
            id="report-search"
            type="search"
            placeholder="ชื่อหรือรหัสรายงาน" /></label
        ><label for="report-select"
          >รายงาน<select id="report-select" disabled>
            <option value="">กำลังโหลด…</option>
          </select></label
        ><small id="catalog-count" role="status"></small>
      </section>
      <section id="report-settings" class="card report-settings" aria-labelledby="settings-title" hidden>
        <div class="settings-head">
          <h2 id="settings-title">เงื่อนไขรายงาน</h2>
          <p class="form-help">ช่องรหัสเว้นว่าง = ทั้งหมด</p>
        </div>
        <form id="report-form" hidden>
          <div id="date-presets" class="date-presets" role="group" aria-label="เลือกช่วงวันที่ด่วน" hidden></div>
          <div class="settings-row">
            <div id="condition-fields" class="condition-grid"></div>
            <label class="dataset-field">ชุดข้อมูล<select id="dataset"></select></label>
            <button id="run-report" class="button primary" type="submit">แสดงรายงาน</button>
          </div>
        </form>
      </section>
      <p id="report-status" class="status" role="status" aria-live="polite">
        เลือกหมวดหรือรายงานเพื่อเริ่มต้น
      </p>
      <article id="result-card" class="card report-result" hidden>
        <header class="result-heading">
          <div>
            <div class="result-title-row">
              <h2 id="result-title" tabindex="-1"></h2>
              <button id="pin-report" type="button" class="pin-button" aria-pressed="false">☆ ปักหมุด</button>
            </div>
            <p id="result-context" class="subtitle"></p>
            <p id="result-info" class="subtitle"></p>
          </div>
          <div class="report-actions">
            <button id="csv-report" class="button secondary">
              ดาวน์โหลด CSV</button
            ><button id="print-report" class="button secondary">
              พิมพ์ / PDF
            </button>
          </div>
        </header>
        <div class="result-tools">
          <label class="result-filter">ค้นหาในหน้านี้<input id="result-filter" type="search" placeholder="พิมพ์คำในแถว เช่น รหัสสินค้า ชื่อลูกค้า" /></label>
          <small id="result-filter-count" role="status"></small>
        </div>
        <div
          class="result-scroll"
          tabindex="0"
          role="region"
          aria-label="ตารางรายงาน"
        >
          <table>
            <thead id="result-head"></thead>
            <tbody id="result-body"></tbody>
          </table>
        </div>
        <nav class="pagination">
          <button id="previous-page" class="button secondary">← ก่อนหน้า</button
          ><span class="page-info"><span id="page-label"></span><label class="page-jump" hidden>ไปหน้า<select id="page-jump"></select></label></span
          ><button id="next-page" class="button secondary">ถัดไป →</button>
        </nav>
      </article>
    </main>
  </body>
</html>
